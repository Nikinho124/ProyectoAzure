{% extends "admin/change_list.html" %}

{% block filters %}
    {{ block.super }}
    <dialog id="revertir-merma-dialog" class="inventario-dialog" aria-labelledby="revertir-merma-titulo">
        <form method="post" id="revertir-merma-form">
            {% csrf_token %}
            <h2 id="revertir-merma-titulo">Anular / corregir merma</h2>
            <p id="revertir-merma-detalle"></p>
            <label for="revertir-merma-motivo">Motivo de la reversión</label>
            <textarea id="revertir-merma-motivo" name="motivo" maxlength="2000" rows="4" required></textarea>
            <label for="revertir-merma-password">Contraseña de confirmación</label>
            <input id="revertir-merma-password" name="password_confirmacion" type="password" autocomplete="current-password" required>
            <div class="inventario-dialog-actions">
                <button class="default" type="submit">Confirmar reversión</button>
                <button class="button" type="button" data-cerrar-dialogo>Cancelar</button>
            </div>
        </form>
    </dialog>
    <script nonce="{{ request.csp_nonce }}">
        (() => {
            const dialog = document.getElementById("revertir-merma-dialog");
            const form = document.getElementById("revertir-merma-form");
            const detalle = document.getElementById("revertir-merma-detalle");
            document.addEventListener("click", (event) => {
                if (!(event.target instanceof Element)) return;
                const trigger = event.target.closest("[data-revertir-merma]");
                if (trigger) {
                    form.action = trigger.dataset.url;
                    detalle.textContent =
                        `${trigger.dataset.medicamento} · Lote ${trigger.dataset.lote} · ` +
                        `${trigger.dataset.cantidad} unidades`;
                    form.elements.namedItem("motivo").value = "";
                    form.elements.namedItem("password_confirmacion").value = "";
                    dialog.showModal();
                    form.elements.namedItem("motivo").focus();
                } else if (event.target.closest("[data-cerrar-dialogo]")) {
                    dialog.close();
                }
            });
        })();
    </script>
{% endblock %}
