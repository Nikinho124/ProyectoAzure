{% extends "farmacia/base_personal.html" %}

{% block title %}Página no encontrada{% endblock %}

{% block content %}
    <section class="pagina-error">
        <div class="pagina-error-tarjeta" aria-labelledby="error-titulo">
            <p class="pagina-error-codigo">404 · PÁGINA NO ENCONTRADA</p>
            <h1 id="error-titulo">No encontramos esa página</h1>
            <p>La dirección ingresada no existe o no está disponible.</p>
            <a class="pagina-error-accion" href="{% url 'farmacia:inicio' %}">
                Volver al Panel Principal
            </a>
        </div>
    </section>
{% endblock %}
