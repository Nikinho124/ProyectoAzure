{% extends "farmacia/base_personal.html" %}

{% block title %}Error temporal{% endblock %}

{% block content %}
    <section class="pagina-error">
        <div class="pagina-error-tarjeta" aria-labelledby="error-titulo">
            <p class="pagina-error-codigo">500 · ERROR TEMPORAL</p>
            <h1 id="error-titulo">No pudimos completar la solicitud</h1>
            <p>Ocurrió un error inesperado. Inténtalo más tarde.</p>
            <a class="pagina-error-accion" href="{% url 'farmacia:inicio' %}">
                Volver al Panel Principal
            </a>
        </div>
    </section>
{% endblock %}
